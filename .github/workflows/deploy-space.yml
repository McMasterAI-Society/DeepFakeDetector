name: Deploy backend to HF Space

on:
  push:
    branches: [development]
    paths:
      - "backend/**"
  workflow_dispatch:
    inputs:
      force_restart:
        description: Restart the Space after deploy if the model manifest changed, even when a new commit was pushed.
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running deploy instead of cancelling it mid-upload.
concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/backend-ci.yml
    with:
      backend-only: true

  deploy:
    name: Upload backend/ to Space
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.HF_SPACE_URL || format('https://huggingface.co/spaces/{0}', vars.HF_SPACE_ID) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      HF_BASE_IMAGE: ${{ vars.HF_BASE_IMAGE }}
      INSTALL_OPTIONAL_DEPS: ${{ vars.INSTALL_OPTIONAL_DEPS || 'false' }}
      FORCE_RESTART: ${{ inputs.force_restart || false }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Secret HF_TOKEN is not set on the production environment or repo"; exit 1; fi
          if [ -z "$HF_SPACE_ID" ]; then echo "::error::Variable HF_SPACE_ID is not set (owner/space-name)"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.30,<1.0"

      - name: Deploy
        id: deploy
        run: python .github/scripts/deploy_space.py

      - name: Summary
        env:
          MANIFEST_CHANGED: ${{ steps.deploy.outputs.manifest_changed }}
          NEW_COMMIT: ${{ steps.deploy.outputs.new_commit }}
          RESTARTED: ${{ steps.deploy.outputs.restarted }}
          SPACE_SHA: ${{ steps.deploy.outputs.space_sha }}
        run: |
          {
            echo "### Space deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Space | \`$HF_SPACE_ID\` |"
            echo "| Space revision | \`$SPACE_SHA\` |"
            echo "| New commit | $NEW_COMMIT |"
            echo "| Model manifest changed | $MANIFEST_CHANGED |"
            echo "| Restarted via API | $RESTARTED |"
          } >> "$GITHUB_STEP_SUMMARY"
