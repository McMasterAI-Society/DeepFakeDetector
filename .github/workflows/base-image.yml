name: Backend base image

# Replaces the manual backend/update-ghcr-base.{sh,ps1} scripts.
on:
  push:
    branches: [development]
    paths:
      - "backend/requirements-runtime.txt"
      - "backend/Dockerfile.base"
      - ".github/workflows/base-image.yml"
  pull_request:
    paths:
      - "backend/requirements-runtime.txt"
      - "backend/Dockerfile.base"
      - ".github/workflows/base-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push Dockerfile.base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deepfake-detector-backend-base" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/development' }}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=deepfake-detector-backend-base
            org.opencontainers.image.description=Dependency base image for the DeepFake Detector backend

      # Pull requests only check that the image builds; nothing is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.base
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Base image pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Set repo variable \`HF_BASE_IMAGE\` to a tag above (\`:latest\` or the pinned sha tag) so deploy-space.yml uses it."
          } >> "$GITHUB_STEP_SUMMARY"
