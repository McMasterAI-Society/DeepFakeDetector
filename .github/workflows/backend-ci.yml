name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "eval/**"
      - "frontend/**"
      - "tools/hf-webhook-relay/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/**"
  push:
    branches: [development, main]
    paths:
      - "backend/**"
      - "eval/**"
      - "frontend/**"
      - "tools/hf-webhook-relay/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/**"
  # Lets deploy-space.yml run the backend test job before deploying.
  workflow_call:
    inputs:
      backend-only:
        description: Run only the backend tests, skipping change detection.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ inputs.backend-only || steps.filter.outputs.backend }}
      frontend: ${{ !inputs.backend-only && steps.filter.outputs.frontend == 'true' }}
      relay: ${{ !inputs.backend-only && steps.filter.outputs.relay == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.backend-only }}
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ !inputs.backend-only }}
        with:
          filters: |
            backend:
              - "backend/**"
              - "eval/**"
              - ".github/workflows/backend-ci.yml"
              - ".github/scripts/**"
            frontend:
              - "frontend/**"
              - ".github/workflows/backend-ci.yml"
            relay:
              - "tools/hf-webhook-relay/**"
              - ".github/workflows/backend-ci.yml"

  backend:
    name: Backend tests (Python 3.11, CPU)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep tests hermetic: no model downloads or Gemini calls from CI.
      HF_HUB_DISABLE_TELEMETRY: "1"
      GOOGLE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            eval/requirements*.txt

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend requirements
        run: pip install -r backend/requirements.txt

      - name: Install eval requirements
        if: hashFiles('eval/requirements.txt') != ''
        run: pip install -r eval/requirements.txt

      - name: Validate model manifest
        run: |
          python - <<'EOF'
          import json, re
          m = json.load(open("backend/model-manifest.json"))
          entries = [m["fusion"], *m["submodels"]]
          assert entries[1:], "manifest has no submodels"
          for e in entries:
              assert re.fullmatch(r"[\w.-]+/[\w.-]+", e["repo_id"]), e
              rev = e.get("revision")
              assert rev is None or re.fullmatch(r"[0-9a-f]{40}", rev), f"revision must be null or a full sha: {e}"
          print(f"OK: {len(entries)} entries")
          EOF

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Run eval tests
        if: hashFiles('eval/tests/**/*.py') != ''
        run: python -m pytest -q eval

  relay:
    name: Webhook relay tests
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/hf-webhook-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/hf-webhook-relay/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend lint, build, test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock', 'frontend/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run test
